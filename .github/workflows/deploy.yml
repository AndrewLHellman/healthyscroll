# Build the web and vision images, push them to GHCR, then pull + restart on
# the server. Needs one repo secret: DEPLOY_SSH_KEY (private key whose public
# half is in root's authorized_keys on the server).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/vision/**"
      - "packages/shared/**"
      - "deploy/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  IMAGE_WEB: ghcr.io/andrewlhellman/healthyscroll-web
  IMAGE_VISION: ghcr.io/andrewlhellman/healthyscroll-vision
  # Hetzner Hillsboro (US West). Moved from Falkenstein 2026-09-27: Instagram's CDN
  # picks a US-West edge for US viewers, and vision fetches video from it per Reel.
  DEPLOY_HOST: 5.78.142.198
  DEPLOY_USER: root
  DEPLOY_DIR: /srv/healthyscroll

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-vision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/vision
          file: apps/vision/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_VISION }}:latest
            ${{ env.IMAGE_VISION }}:${{ github.sha }}
          cache-from: type=gha,scope=vision
          cache-to: type=gha,mode=max,scope=vision

  deploy:
    needs: [build-web, build-vision]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Pull and restart on the server
        run: |
          SSH="ssh -i ~/.ssh/deploy $DEPLOY_USER@$DEPLOY_HOST"
          $SSH "mkdir -p $DEPLOY_DIR && touch $DEPLOY_DIR/.env"
          scp -i ~/.ssh/deploy deploy/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/docker-compose.yml"
          # The job token can read this repo's packages; log the server in with it, pull, restart.
          echo "${{ secrets.GITHUB_TOKEN }}" | $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin \
            && cd $DEPLOY_DIR \
            && docker compose pull --quiet \
            && docker compose up -d --remove-orphans \
            && docker image prune -f \
            && docker logout ghcr.io"
      - name: Check they're up
        run: |
          ssh -i ~/.ssh/deploy $DEPLOY_USER@$DEPLOY_HOST '
            wait_for() {
              for i in $(seq 1 "$2"); do curl -fs -o /dev/null "$1" && echo "up: $1" && return 0; sleep 1; done
              docker compose -f /srv/healthyscroll/docker-compose.yml logs --tail 50; return 1
            }
            wait_for http://127.0.0.1:3001/ 20 && wait_for http://127.0.0.1:8000/health 90'
